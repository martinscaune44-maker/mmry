<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>MMRY — Journey Builder</title>

<meta name="theme-color" content="#0e0e0f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MMRY" />

<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="builder">

<div id="map"></div>

<div id="top-bar">
  <input id="journey-name" type="text" placeholder="Untitled journey" />
  <div id="mode-toggle">
    <button id="mode-build" class="mode active" type="button">Build</button>
    <button id="mode-walk" class="mode" type="button">Walk</button>
  </div>
</div>

<div id="status-bar">
  <div id="zone-indicator" class="no-zone">
    <span id="zone-dot"></span>
    <span id="zone-text">Build mode</span>
  </div>
</div>

<!-- Build mode -->
<div id="build-panel">
  <div id="build-actions">
    <button id="add-here" type="button">+ Add at my location</button>
    <span class="hint">or tap the map</span>
  </div>
  <div id="location-help"></div>
  <div id="panel-scroll">
    <p class="panel-note">
      Stand where the sound belongs and tap <strong>Record here</strong> — or
      pick an existing file.
    </p>
    <ul id="checkpoint-list"></ul>
  </div>
  <div id="share-box">
    <div id="share-bar">
      <span id="journey-summary">Nothing to share yet</span>
      <div class="share-actions">
        <button id="clear-journey" class="danger" type="button">Clear</button>
        <button id="publish-journey" type="button" disabled>Share</button>
      </div>
    </div>
    <p id="publish-status"></p>
    <div id="share-result">
      <input id="share-link" type="text" readonly />
      <button id="copy-link" type="button">Copy</button>
    </div>
  </div>
</div>

<!-- Walk mode start gate -->
<div id="start-overlay" class="hidden">
  <div id="start-panel">
    <h1 id="start-title">Ready to walk</h1>
    <p>Put on headphones, then tap below and allow location access.</p>
    <button id="start-button" type="button">Start walking</button>
    <button id="back-to-build" class="linky" type="button">Back to building</button>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="supabase-config.js"></script>
<script src="engine.js"></script>
<script src="share.js"></script>
<script src="recorder.js"></script>
<script src="storage.js"></script>
<script src="builder.js"></script>
<script>
  // Registered immediately rather than on window load: that event waits for
  // every map tile, so a slow network would delay caching indefinitely.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  }
</script>
</body>
</html>
