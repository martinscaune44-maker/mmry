<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MMRY — My walks</title>

<meta name="theme-color" content="#0e0e0f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MMRY" />

<link rel="stylesheet" href="style.css" />
</head>
<body class="account">

<main id="account-page">
  <header id="account-head">
    <a class="back" href="builder.html">← Builder</a>
    <h1>My walks</h1>
  </header>

  <!-- Signed out -->
  <section id="sign-in-panel" hidden>
    <p class="lede">
      An account keeps your published walks together, and lets you decide who
      can open them. You don't need one to build or share a walk.
    </p>

    <form id="sign-in-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required
             inputmode="email" autocapitalize="off" spellcheck="false"
             placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password"
             minlength="6" placeholder="At least 6 characters" />

      <div class="form-actions">
        <button id="sign-in" type="submit">Sign in</button>
        <button id="sign-up" class="secondary" type="button">Create account</button>
      </div>
    </form>

    <p class="or">or</p>

    <div class="alt-signin">
      <button id="email-code" class="secondary" type="button">Email me a code instead</button>
      <button id="google" class="secondary" type="button">Continue with Google</button>
    </div>

    <p id="auth-status"></p>
  </section>

  <!-- Waiting for the emailed code -->
  <section id="code-panel" hidden>
    <h2 id="code-title">Check your email</h2>
    <p class="lede">
      We sent a six-digit code to <strong id="code-email"></strong>. Type it
      below — no link to tap, and no leaving this page.
    </p>

    <form id="code-form">
      <label for="code">Code</label>
      <!-- one-time-code lets iOS and Android offer it straight from the
           notification, which is the whole point of using a code. -->
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]*" maxlength="6" placeholder="123456" />
      <button id="verify-code" type="submit">Confirm</button>
    </form>

    <div class="code-actions">
      <button id="resend-code" class="linky" type="button">Send another code</button>
      <button id="code-back" class="linky" type="button">Use a different email</button>
    </div>

    <p id="code-status"></p>
  </section>

  <!-- Signed in -->
  <section id="walks-panel" hidden>
    <div id="account-summary">
      <span id="signed-in-as"></span>
      <button id="sign-out" class="linky" type="button">Sign out</button>
    </div>

    <div id="walk-filters" role="group" aria-label="Filter by tag"></div>

    <p id="walks-status"></p>
    <ul id="walk-list"></ul>
  </section>
</main>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="share.js"></script>
<script src="account.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  }
</script>
</body>
</html>
