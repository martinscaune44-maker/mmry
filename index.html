<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>MMRY Soundwalk</title>
<meta name="description" content="Music tied to places. The sound starts when you arrive." />

<meta name="theme-color" content="#0e0e0f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MMRY" />

<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="start-overlay">
  <div id="start-panel">
    <div class="mark" aria-hidden="true"></div>
    <h1>MMRY</h1>
    <p>Music tied to places. Put on headphones, then walk — the sound starts when you arrive.</p>
    <button id="start-button" type="button">Start soundwalk</button>
    <a id="builder-link" href="builder.html">Build your own journey →</a>
  </div>
</div>

<div id="map"></div>

<div id="status-bar">
  <div id="zone-indicator" class="no-zone">
    <span id="zone-dot"></span>
    <span id="zone-text">Waiting for location…</span>
  </div>
  <div id="distance-readout"></div>
  <div id="accuracy-warning">Weak GPS signal — zones may trigger late</div>
  <div id="location-help"></div>
</div>

<button id="recenter" type="button" aria-label="Recentre on my location">
  <span aria-hidden="true"></span>
</button>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="engine.js"></script>
<script src="zones.js"></script>
<script src="app.js"></script>
<script>
  // Registered immediately rather than on window load: that event waits for
  // every map tile, so a slow network would delay caching indefinitely.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  }
</script>
</body>
</html>
