<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MMRY Soundwalk Demo</title>

<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="start-overlay">
  <div id="start-panel">
    <div class="mark" aria-hidden="true"></div>
    <h1>MMRY</h1>
    <p>Music tied to places. Put on headphones, then walk — the sound starts when you arrive.</p>
    <button id="start-button" type="button">Start soundwalk</button>
    <a id="builder-link" href="builder.html">Build your own journey →</a>
  </div>
</div>

<div id="map"></div>

<div id="status-bar">
  <div id="zone-indicator" class="no-zone">
    <span id="zone-dot"></span>
    <span id="zone-text">Waiting for location…</span>
  </div>
  <div id="distance-readout"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="engine.js"></script>
<script src="zones.js"></script>
<script src="app.js"></script>
</body>
</html>
