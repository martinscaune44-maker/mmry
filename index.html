<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MMRY Soundwalk Demo</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="start-overlay">
  <div id="start-panel">
    <h1>MMRY Soundwalk</h1>
    <p>Put on headphones, then tap below and allow location access.</p>
    <button id="start-button" type="button">Start soundwalk</button>
  </div>
</div>

<div id="map"></div>

<div id="status-bar">
  <div id="zone-indicator" class="no-zone">
    <span id="zone-dot"></span>
    <span id="zone-text">Waiting for location…</span>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="zones.js"></script>
<script src="app.js"></script>
</body>
</html>
